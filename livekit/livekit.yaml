# LiveKit server configuration
# Replace the key/secret below with output from: livekit-server generate-keys
port: 7880
log_level: info

rtc:
  tcp_port: 7882
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true       # auto-detects VPS public IP for ICE candidates

keys:
  # Format — APIKey: secret   (generated by: livekit-server generate-keys)
  APIxxxxxxxxxxxxxxxxx: replace_with_your_secret_here

room:
  auto_create: true
  max_participants: 100

# Uncomment for multi-node / high-availability (requires Redis)
# redis:
#   address: localhost:6379

services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host          # needed so LiveKit can detect the public IP for ICE
    volumes:
      - ./livekit.yaml:/livekit.yaml:ro
    command: --config /livekit.yaml

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
